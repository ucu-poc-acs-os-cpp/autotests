# Reusable workflow, called from a student repository:
#   jobs:
#     test:
#       uses: ucu-poc-acs-os-cpp/autotests/.github/workflows/lab.yml@main
#       with: { ia: "f4" }                  # the lab is detected; or: { lab: "acs integral-parallel" }
name: lab
on:
  workflow_call:
    inputs:
      lab: { required: false, type: string, default: "auto", description: "'auto' (from the CMake project name / repository name) or e.g. 'poc asm' | 'acs words-par'" }
      packages: { required: false, type: string, default: "", description: "apt packages the lab needs, e.g. 'libicu-dev libboost-locale-dev libarchive-dev'" }
      variant: { required: false, type: string, default: "" }
      ia: { required: false, type: string, default: "", description: "additional tasks, comma separated, or all" }
      args: { required: false, type: string, default: "", description: "extra labtest options (--exe ..., --orig ...)" }
      release: { required: false, type: string, default: "latest" }
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install packages
        if: inputs.packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ inputs.packages }}
      - name: Download labtest
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release download ${{ inputs.release == 'latest' && '' || inputs.release }} --repo ucu-poc-acs-os-cpp/autotests --pattern labtest-linux-x64 --output labtest
          chmod +x labtest
      - name: Run tests
        run: |
          IA="${{ inputs.ia }}"
          ./labtest ${{ inputs.lab }} ${{ inputs.variant }} -p . ${IA:+--ia $IA} ${{ inputs.args }} --json result.json | tee summary.txt
      - if: always()
        run: |
          { echo '### labtest ${{ inputs.lab }} ${{ inputs.variant }}'; echo '```'; cat summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: labtest-result, path: result.json }
