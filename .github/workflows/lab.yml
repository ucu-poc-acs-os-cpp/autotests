# Reusable workflow, called from a student repository:
#   jobs:
#     test:
#       uses: ucu-poc-acs-os-cpp/autotests/.github/workflows/lab.yml@main
#       with: { lab: "acs integral-parallel", ia: "f4", variant: "" }
name: lab
on:
  workflow_call:
    inputs:
      lab: { required: true, type: string, description: "e.g. poc asm | acs words-par" }
      variant: { required: false, type: string, default: "" }
      ia: { required: false, type: string, default: "", description: "additional tasks, comma separated, or all" }
      args: { required: false, type: string, default: "", description: "extra labtest options (--exe ..., --orig ...)" }
      release: { required: false, type: string, default: "latest" }
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download labtest
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release download ${{ inputs.release == 'latest' && '' || inputs.release }} --repo ucu-poc-acs-os-cpp/autotests --pattern labtest-linux --output labtest
          chmod +x labtest
      - name: Run tests
        run: |
          IA="${{ inputs.ia }}"
          ./labtest ${{ inputs.lab }} ${{ inputs.variant }} -p . ${IA:+--ia $IA} ${{ inputs.args }} --json result.json | tee summary.txt
      - if: always()
        run: |
          { echo '### labtest ${{ inputs.lab }} ${{ inputs.variant }}'; echo '```'; cat summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: labtest-result, path: result.json }
